name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pom versions must match the VERSION file
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          # Project version is shared across all modules; check every pom's own version line.
          MISMATCH=0
          for p in pom.xml */pom.xml; do
            POM=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "$p" | head -1)
            if [ "$POM" != "$V" ]; then
              echo "::error file=$p::$p version ($POM) != VERSION ($V)"
              MISMATCH=1
            fi
          done
          if [ "$MISMATCH" = "1" ]; then
            echo "Fix with: ./mvnw versions:set -DnewVersion=$V -DgenerateBackupPoms=false -DprocessAllModules"
            exit 1
          fi
          echo "All pom versions match VERSION ($V)."

  cli-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run CLI tests
        run: cd tnra-cli-app && mvn --batch-mode test

  production-build:
    # The Vaadin production bundle (frontend build) is only exercised with -Pproduction,
    # which the test suite never enables. Build it here so a frontend packaging regression
    # fails the PR instead of the deploy.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build production jars (Vaadin frontend bundle)
        run: ./mvnw --batch-mode -Pproduction -DskipTests package

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run test suite with coverage
        id: verify
        continue-on-error: true
        run: ./mvnw --batch-mode verify

      - name: Checkout badges branch into subdir
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: badges
          path: badges-branch

      - name: Set build badge metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: build_badge
        run: |
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            echo "status=passing" >> "$GITHUB_OUTPUT"
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          else
            echo "status=failing" >> "$GITHUB_OUTPUT"
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate coverage badge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.verify.outcome == 'success'
        uses: cicirello/jacoco-badge-generator@v2.1.0
        with:
          generate-branches-badge: false
          jacoco-csv-file: tnra-app/target/site/jacoco/jacoco.csv
          badges-directory: badges-branch

      - name: Generate build badge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL \
            "https://img.shields.io/badge/build-${{ steps.build_badge.outputs.status }}-${{ steps.build_badge.outputs.color }}.svg" \
            -o badges-branch/build.svg

      - name: Commit and push to badges branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: badges-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          if git diff --staged --quiet; then
            echo "No badge changes — skipping commit"
            exit 0
          fi
          git commit -m "chore: update badges (coverage / build)"
          git push origin badges

      - name: Fail job if verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1

      - name: Tag with version from VERSION file
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.verify.outcome == 'success'
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
            if [ -n "$VERSION" ]; then
              # Skip if tag already exists. Check the REMOTE: actions/checkout is shallow and
              # does not fetch tags, so a local rev-parse never sees existing tags.
              if [ -z "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
                git tag "$VERSION"
                git push origin "$VERSION"
                echo "Tagged $VERSION"
              else
                echo "Tag $VERSION already exists — skipping"
              fi
            fi
          fi

  # Publishes the NAS's three TNRA images. The Synology pulls `:latest` on a timer;
  # `:sha-<short>` and the version tag are there for pinning a rollback.
  publish:
    name: Publish images
    needs: [version-check, cli-test, production-build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # All three Dockerfiles copy a prebuilt target/*.jar, so build the reactor once.
      - name: Build production jars (Vaadin frontend bundle)
        run: ./mvnw --batch-mode -Pproduction -DskipTests package

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-landing
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dogeared/tnra-landing
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}

      - id: meta-billing
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dogeared/tnra-billing
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}

      - id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dogeared/tnra-app
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Push tnra-landing
        uses: docker/build-push-action@v6
        with:
          context: tnra-landing-app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-landing.outputs.tags }}
          labels: ${{ steps.meta-landing.outputs.labels }}
          cache-from: type=gha,scope=tnra-landing
          cache-to: type=gha,mode=max,scope=tnra-landing

      - name: Push tnra-billing
        uses: docker/build-push-action@v6
        with:
          context: tnra-billing-app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-billing.outputs.tags }}
          labels: ${{ steps.meta-billing.outputs.labels }}
          cache-from: type=gha,scope=tnra-billing
          cache-to: type=gha,mode=max,scope=tnra-billing

      - name: Push tnra-app (the-og)
        uses: docker/build-push-action@v6
        with:
          context: tnra-app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=tnra-app
          cache-to: type=gha,mode=max,scope=tnra-app

  deploy-production:
    name: Deploy TNRA production components to NAS
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Ask the NAS to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          PROJECT: tnra-production
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::notice::deploy webhook not configured; the NAS timer will pick this up"
            exit 0
          fi
          BODY=$(printf '{"project":"%s","sha":"%s"}' "$PROJECT" "$GITHUB_SHA")
          TS=$(date +%s)
          SIG=$(python3 -c 'import hashlib,hmac,sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode()+b"."+sys.argv[3].encode(), hashlib.sha256).hexdigest())' "$DEPLOY_WEBHOOK_SECRET" "$TS" "$BODY")
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$DEPLOY_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H "X-Deploy-Timestamp: $TS" \
              -H "X-Deploy-Signature: sha256=$SIG" \
              --data "$BODY" || echo 000)
            if [ "$code" = "200" ]; then
              cat /tmp/deploy.json
              exit 0
            fi
            echo "attempt $attempt failed (HTTP $code)"
            cat /tmp/deploy.json 2>/dev/null || true
            sleep 10
          done
          exit 1

  deploy-the-og:
    name: Deploy The OG TNRA  components to NAS
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Ask the NAS to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          PROJECT: tnra-the-og
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::notice::deploy webhook not configured; the NAS timer will pick this up"
            exit 0
          fi
          BODY=$(printf '{"project":"%s","sha":"%s"}' "$PROJECT" "$GITHUB_SHA")
          TS=$(date +%s)
          SIG=$(python3 -c 'import hashlib,hmac,sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode()+b"."+sys.argv[3].encode(), hashlib.sha256).hexdigest())' "$DEPLOY_WEBHOOK_SECRET" "$TS" "$BODY")
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$DEPLOY_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H "X-Deploy-Timestamp: $TS" \
              -H "X-Deploy-Signature: sha256=$SIG" \
              --data "$BODY" || echo 000)
            if [ "$code" = "200" ]; then
              cat /tmp/deploy.json
              exit 0
            fi
            echo "attempt $attempt failed (HTTP $code)"
            cat /tmp/deploy.json 2>/dev/null || true
            sleep 10
          done
          exit 1
